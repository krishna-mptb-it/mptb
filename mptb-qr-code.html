<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tourism Department, Madhya Pradesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Marcellus&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-deep:   #5C1626;
    --maroon:        #7C1F2E;
    --gold:          #C9962F;
    --gold-bright:   #E4B559;
    --cream-soft:    #FBF4E4;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    width:100%;
    overflow:hidden;
  }
  body{
    font-family:'Poppins', sans-serif;
    background:var(--cream-soft);
    display:flex;
    flex-direction:column;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ============ HEADING ============ */
  header{
    flex:0 0 auto;
    padding:2.2vh 2vw 1.6vh;
    background:var(--cream-soft);
    border-bottom:3px double var(--gold);
    text-align:center;
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:clamp(1.6rem, 4.6vh, 3rem);
    color:var(--maroon-deep);
    letter-spacing:0.01em;
    line-height:1.15;
  }

    min-height:0;
    position:relative;

      repeating-linear-gradient(45deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 34px);
    overflow:hidden;
  }

  .qr-stage{
    position:relative;
    height:100%;
    width:100%;
  }

  /* each item = QR code + label, side by side */
  .qr-item{
    position:absolute;
    display:flex;
    align-items:center;
    gap:1.4vh;
    max-width:46vw;
    opacity:0;
    animation-fill-mode:forwards;
    animation-timing-function:cubic-bezier(0.22, 1, 0.36, 1);
  }
  .qr-item .frame{
    flex:0 0 auto;
    background:var(--cream-soft);
    border-radius:12px;
    padding:1.2vh;
    box-shadow:0 16px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(228,181,89,0.5);
  }
  .qr-item .frame img{
    display:block;
    width:clamp(130px, 18vh, 270px);
    border-radius:5px;
  }
  .qr-item .label{
    flex:0 1 auto;
    text-align:left;
  }
  .qr-item .label .title{
    font-family:'Marcellus', serif;
    color:var(--cream-soft);
    font-size:clamp(0.9rem, 2.1vh, 1.35rem);
    line-height:1.3;
  }
  .qr-item .label .sub{
    font-family:'Poppins', sans-serif;
    font-weight:400;
    color:var(--gold-bright);
    font-size:clamp(0.62rem, 1.3vh, 0.85rem);
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:0.5vh;
  }

  /* item 3 sits at the right edge — mirror it so the label
     grows inward instead of running off the screen */
  .qr-item.item-3{ flex-direction:row-reverse; }
  .qr-item.item-3 .label{ text-align:right; }

  /* Item 1 — apex: settles at top-center */
  .qr-item.item-1{
    animation-name:qrToTop;
    animation-duration:3.1s;
    animation-delay:0.1s;
    z-index:3;
  }
  /* Item 2 — settles at bottom-left */
  .qr-item.item-2{
    animation-name:qrToBottomLeft;
    animation-duration:3.1s;
    animation-delay:0.28s;
    z-index:2;
  }
  /* Item 3 — settles at bottom-right */
  .qr-item.item-3{
    animation-name:qrToBottomRight;
    animation-duration:3.1s;
    animation-delay:0.46s;
    z-index:2;
  }

  @keyframes qrToTop{
    0%   { top:50%; left:50%; opacity:0;   transform:translate(-50%,-50%) scale(0.32) rotate(-9deg); }
    22%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1.08) rotate(2deg); }
    38%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
    86%  { top:19%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
    100% { top:22%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
  }
  @keyframes qrToBottomLeft{
    0%   { top:50%; left:50%; opacity:0;   transform:translate(-50%,-50%) scale(0.32) rotate(-9deg); }
    22%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1.08) rotate(-2deg); }
    38%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
    86%  { top:85%; left:27%; opacity:1;   transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
    100% { top:82%; left:29%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
  }
  @keyframes qrToBottomRight{
    0%   { top:50%; left:50%; opacity:0;   transform:translate(-50%,-50%) scale(0.32) rotate(9deg); }
    22%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1.08) rotate(2deg); }
    38%  { top:50%; left:50%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
    86%  { top:85%; left:73%; opacity:1;   transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
    100% { top:82%; left:71%; opacity:1;   transform:translate(-50%,-50%) scale(1)    rotate(0deg); }
  }

  /* Portrait / narrow devices — stack label under the QR instead of beside it */
  @media (orientation:portrait){
    .qr-item{ flex-direction:column; max-width:60vw; gap:0.8vh; }
    .qr-item.item-3{ flex-direction:column; }
    .qr-item .label,
    .qr-item.item-3 .label{ text-align:center; }
    .qr-item .frame img{ width:clamp(120px, 20vh, 220px); }

    @keyframes qrToTop{
      0%   { top:50%; left:50%; opacity:0; transform:translate(-50%,-50%) scale(0.32) rotate(-9deg); }
      22%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg); }
      38%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
      86%  { top:15%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
      100% { top:18%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    }
    @keyframes qrToBottomLeft{
      0%   { top:50%; left:50%; opacity:0; transform:translate(-50%,-50%) scale(0.32) rotate(-9deg); }
      22%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(-2deg); }
      38%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
      86%  { top:88%; left:28%; opacity:1; transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
      100% { top:85%; left:30%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    }
    @keyframes qrToBottomRight{
      0%   { top:50%; left:50%; opacity:0; transform:translate(-50%,-50%) scale(0.32) rotate(9deg); }
      22%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg); }
      38%  { top:50%; left:50%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
      86%  { top:88%; left:72%; opacity:1; transform:translate(-50%,-50%) scale(1.04) rotate(0deg); }
      100% { top:85%; left:70%; opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    }
  }
</style>
