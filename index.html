<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referrer policy: don't leak the embed-token URL to third parties -->
    <meta name="referrer" content="no-referrer">
    <!--
      Content-Security-Policy: only allow this page to frame Power BI,
      and only allow scripts/styles from this document itself.
      (A meta CSP can't set frame-ancestors — do that with a real
      HTTP header on whatever server hosts this file, see notes at
      the bottom of this file.)
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   frame-src https://app.powerbi.com;
                   base-uri 'none';
                   form-action 'none';">
    <title>MPTB Dashboard with Manual Pause</title>
    <style>
        body, html, iframe {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: none;
            background-color: #000;
	    transition: opacity 1s ease-in-out;
        }

        #controlBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s ease;
        }

        #controlBtn.paused {
            background-color: #34c759;
        }
    </style>
</head>
<body>
    <button id="controlBtn" onclick="togglePause()">⏸ PAUSE LOOP</button>

    <!--
      sandbox: strips the iframe down to only what Power BI's viewer
      actually needs. No top-level navigation, no downloads triggered
      without a click, no auto-fullscreen abuse, etc.
      referrerpolicy: belt-and-suspenders on top of the meta tag above.
    -->
    <iframe
        id="tv_frame"
        src=""
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        referrerpolicy="no-referrer"
        title="Rotating dashboard report">
    </iframe>
<iframe id="frame1" class="visible"></iframe>
  <iframe id="frame2" class="hidden"></iframe>

    <script>
    (function () {
        "use strict";

        // Only these origins are ever allowed to be loaded into the iframe.
        // Anything else (even if it ends up in the playlist by accident,
        // typo, or future tampering) is silently blocked.
        var ALLOWED_ORIGINS = ["https://app.powerbi.com"];

        // Frozen so it can't be mutated from the console at runtime
        // (e.g. on an unattended kiosk PC). Doesn't hide the tokens —
        // see the note at the bottom of this file about that — but it
        // does stop someone from redirecting the loop to a different
        // (possibly malicious) page via devtools.
        var playlist = Object.freeze([
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMjhkNDIwYmUtZjQ4NS00NzlkLTkyNjAtN2NlNTc5MGIyNWI1IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=89f4222f499db8b7151e", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiODg4ZGU0MmEtOGQxYS00ZWUwLTg2YzAtMjIwYzFlMzNlMGY2IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 30 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiZTRkMzY4OWItODkxOC00Y2RmLTgzNjUtOWYxNmNjYjRjMzZhIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=96f23636355369177a32", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMWNlYjU1MWUtYWE2Yi00MGVlLWI5ZjktNWFiNjBmYjlhYTIwIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=8fdd5fa7970fdfe09973", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiYTE1N2IwM2MtOGZkNC00NmMwLTg4MmYtNzFiMjZjOGYwMWVmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=f3fc2c2f149db14e5fb9", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiYzFiYzNjMjMtMmY1Zi00NDhmLTg3MzItNzEzZjcxMzBlOTE5IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=e951a6008d400334c680", seconds: 60 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiNzc1NTAzNjEtMDRkNC00NDQwLTg3NTgtMjdkNDVkMDRlZTllIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMWM5ODE2ZmEtZjRmMC00YWVjLWJmMzUtMDhhZGYwMmY1OWNmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 15 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiNWFlNzg4OWItZTc3NS00ZTY3LWFmNmUtNzM2NWMwMjMyOWFmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 15 }
        ]);

let currentIndex = 0;
  let rotationTimeout = null;
  let isPaused = false;

  function isAllowedUrl(rawUrl) {
    try {
      const parsed = new URL(rawUrl, window.location.href);
      if (parsed.protocol !== "https:") return false;
      return ALLOWED_ORIGINS.indexOf(parsed.origin) !== -1;
    } catch (e) {
      return false;
    }
  }

  function rotatePages() {
    if (isPaused) return;
    if (!Array.isArray(playlist) || playlist.length === 0) {
      console.error("Playlist is empty; nothing to rotate.");
      return;
    }

    const currentItem = playlist[currentIndex];
    if (!currentItem || typeof currentItem.url !== "string") {
      console.error("Invalid playlist item at index", currentIndex);
      // advance safely
      currentIndex = (currentIndex + 1) % playlist.length;
      rotationTimeout = setTimeout(rotatePages, 15000);
      return;
    }

    if (isAllowedUrl(currentItem.url)) {
      document.getElementById("tv_frame").src = currentItem.url;
    } else {
      console.error("Blocked disallowed URL:", currentItem.url);
    }

    // default to 15 seconds if invalid
    const waitTime = (Number.isFinite(currentItem.seconds) ? currentItem.seconds : 15) * 1000;
    currentIndex = (currentIndex + 1) % playlist.length;

    clearTimeout(rotationTimeout);
    rotationTimeout = setTimeout(rotatePages, waitTime);
  }

  function togglePause() {
    const btn = document.getElementById("controlBtn");
    isPaused = !isPaused;
    if (isPaused) {
      clearTimeout(rotationTimeout);
      btn.textContent = "▶ RESUME ROTATION";
      btn.classList.add("paused");
      btn.setAttribute("aria-pressed", "true");
    } else {
      btn.textContent = "⏸ PAUSE LOOP";
      btn.classList.remove("paused");
      btn.setAttribute("aria-pressed", "false");
      rotatePages();
    }
  }

  // Bind event listener instead of inline onclick
  window.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById("controlBtn");
    btn.addEventListener("click", togglePause);
    btn.setAttribute("role", "button");
    btn.setAttribute("aria-pressed", "false");
    // start rotation only after DOM ready
    rotatePages();
  }, { once: true });

})();
            </script>
</body>
</html>

<!--
  NOTES ON REMAINING RISK (can't be fixed from inside the HTML file alone):

  1. Token exposure: the "?r=..." parameter on each Power BI URL is a
     base64-encoded {key, tenant} pair that itself grants view access to
     the report. Anyone with this file (view-source, or by sniffing the
     flyn.link redirect) can open those reports directly, forever, outside
     your TV dashboard. To actually close this off:
       - Regenerate ("Manage embed codes" -> revoke) these Power BI public
         links periodically.
       - In Power BI, prefer "Publish to web" only if you're fine with the
         content being effectively public; otherwise switch to secure
         embedding (Power BI Embedded with an app-owns-data token minted
         server-side, or embedding behind Azure AD auth) so no long-lived
         secret sits in client-side HTML at all.
       - Don't rely on flyn.link/obscurity as access control — treat these
         links as already public.

  2. Host-level headers: if/when this file is served from a web server
     (not just opened locally on the TV), also set these real HTTP
     response headers there, since a <meta> tag can't fully replace them:
       X-Frame-Options: DENY
       Content-Security-Policy: frame-ancestors 'none'
       X-Content-Type-Options: nosniff

  3. Physical/kiosk security: if the TV's browser is reachable via
     keyboard/mouse or a remote debugging port, anyone with physical
     access can still open devtools and bypass client-side protections.
     Lock down the OS/browser (kiosk mode, disabled devtools, no other
     apps) at the device level — no amount of JavaScript hardening
     substitutes for that.
-->
