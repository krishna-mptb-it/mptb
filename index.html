<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Referrer policy: don't leak the embed-token URL -->
  <meta name="referrer" content="no-referrer" />
  <!--
    Slightly relaxed CSP for kiosk/local use on Raspberry Pi.
    Keeps remote frame-src narrow (Power BI), but allows data: and blob: URLs
    which Chromium on Pi sometimes uses for embedding or wake-lock fallbacks.
    If you can set real HTTP headers on your server, prefer setting CSP headers there.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';
                 connect-src 'self' https://app.powerbi.com;
                 frame-src https://app.powerbi.com data: blob:;
                 base-uri 'none';
                 form-action 'none';" />
  <title>MPTB Dashboard — Pi Kiosk</title>
  <style>
    :root{
      --bg: #000;
      --btn-bg: #ff3b30;
      --btn-bg-paused: #34c759;
      --btn-fg: #fff;
      --status-fg: #fff;
      --status-bg: rgba(0,0,0,0.45);
    }
    html,body,#tv_frame{
      height:100%;
      width:100%;
      margin:0;
      padding:0;
      background:var(--bg);
      color:#fff;
      overflow:hidden;
      border:0;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      transition:opacity .6s ease;
    }
    #tv_frame{
      display:block;
      width:100%;
      height:100%;
      border:0;
    }
    /* Big, touch-friendly control */
    #controlBtn{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:9999;
      padding:14px 22px;
      font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size:18px;
      font-weight:600;
      background:var(--btn-bg);
      color:var(--btn-fg);
      border:0;
      border-radius:10px;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,0.5);
      touch-action:manipulation;
    }
    #controlBtn.paused{ background:var(--btn-bg-paused); }
    /* small status overlay */
    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 9998;
      background: var(--status-bg);
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--status-fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      backdrop-filter: blur(4px);
    }
    #overlayMsg {
      position:fixed;
      left:50%;
      top:6px;
      transform:translateX(-50%);
      z-index:9999;
      background: rgba(0,0,0,0.5);
      padding:6px 10px;
      border-radius:8px;
      color:#fff;
      font-size:12px;
      font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="overlayMsg" aria-hidden="true">MPTB Dashboard — Raspberry Pi kiosk build</div>

  <iframe id="tv_frame"
          title="Rotating dashboard report"
          sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
          referrerpolicy="no-referrer"
          src="">
  </iframe>

  <button id="controlBtn" aria-pressed="false" aria-label="Pause rotation">⏸ PAUSE</button>
  <div id="status">loading...</div>

  <script>
  (function(){
    "use strict";

    // CONFIG: If playlist.json exists beside this file, it will be loaded and used.
    // Format: [{ "url": "...", "seconds": 60 }, ...]
    const EXTERNAL_PLAYLIST_FILE = "./playlist.json";

    // Allowed origins - only these will be allowed to be set into the iframe.
    const ALLOWED_ORIGINS = ["https://app.powerbi.com"];

    // Embedded fallback playlist (kept frozen)
    const EMBED_PLAYLIST = Object.freeze([
      { url: "https://app.powerbi.com/view?r=eyJrIjoiMjhkNDIwYmUtZjQ4NS00NzlkLTkyNjAtN2NlNTc5MGIyNWI1IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=89f4222f499db8b7151e", seconds: 60 },
      { url: "https://app.powerbi.com/view?r=eyJrIjoiODg4ZGU0MmEtOGQxYS00ZWUwLTg2YzAtMjIwYzFlMzNlMGY2IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 30 },
      { url: "https://app.powerbi.com/view?r=eyJrIjoiZTRkMzY4OWItODkxOC00Y2RmLTgzNjUtOWYxNmNjYjRjMzZhIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=96f23636355369177a32", seconds: 60 }
      // ...add more or override via playlist.json
    ]);

    // Runtime state
    let playlist = EMBED_PLAYLIST;
    let currentIndex = 0;
    let rotationTimeout = null;
    let isPaused = false;
    let wakeLock = null;

    const frame = document.getElementById("tv_frame");
    const btn = document.getElementById("controlBtn");
    const status = document.getElementById("status");

    // Utility: check allowed
    function isAllowedUrl(rawUrl){
      try {
        const parsed = new URL(rawUrl, window.location.href);
        if (parsed.protocol !== "https:") return false;
        return ALLOWED_ORIGINS.indexOf(parsed.origin) !== -1;
      } catch(e){
        return false;
      }
    }

    // Load external playlist if present (best-effort)
    async function tryLoadExternalPlaylist(){
      try {
        const resp = await fetch(EXTERNAL_PLAYLIST_FILE, {cache: "no-store"});
        if (!resp.ok) {
          // no file present (404) or cannot fetch - use embedded
          status.textContent = "Using built-in playlist";
          return;
        }
        const data = await resp.json();
        if (Array.isArray(data) && data.length>0) {
          // basic validation: ensure urls are strings
          const valid = data.filter(it => it && typeof it.url === "string");
          if (valid.length>0) {
            playlist = Object.freeze(valid);
            status.textContent = "Loaded external playlist";
            console.info("External playlist loaded", playlist);
          }
        }
      } catch (err){
        console.warn("External playlist not loaded:", err);
        status.textContent = "Using built-in playlist";
      }
    }

    // Rotation
    function rotatePages(){
      if (isPaused) return;
      if (!Array.isArray(playlist) || playlist.length === 0) {
        console.error("Playlist empty");
        status.textContent = "Playlist empty";
        return;
      }

      const item = playlist[currentIndex];
      if (!item || typeof item.url !== "string") {
        console.error("Invalid playlist item", item);
        currentIndex = (currentIndex + 1) % playlist.length;
        rotationTimeout = setTimeout(rotatePages, 60000);
        return;
      }

      if (isAllowedUrl(item.url)) {
        status.textContent = `Loading ${currentIndex+1}/${playlist.length}`;
        frame.src = item.url;
      } else {
        console.error("Blocked URL (not in allowlist):", item.url);
        status.textContent = "Blocked URL in playlist";
      }

      const wait = (Number.isFinite(item.seconds) ? item.seconds : 60) * 1000;
      currentIndex = (currentIndex + 1) % playlist.length;

      clearTimeout(rotationTimeout);
      rotationTimeout = setTimeout(rotatePages, wait);
    }

    // Pause / resume toggle
    function togglePause(){
      isPaused = !isPaused;
      if (isPaused) {
        clearTimeout(rotationTimeout);
        btn.textContent = "▶ RESUME";
        btn.classList.add("paused");
        btn.setAttribute("aria-pressed","true");
        status.textContent = "Paused";
        releaseWakeLock();
      } else {
        btn.textContent = "⏸ PAUSE";
        btn.classList.remove("paused");
        btn.setAttribute("aria-pressed","false");
        status.textContent = "Resuming...";
        requestWakeLock(); // try to keep awake when resuming
        rotatePages();
      }
    }

    // Wake Lock (screen) for Pi kiosk: modern browsers support navigator.wakeLock
    async function requestWakeLock(){
      if (!('wakeLock' in navigator)) {
        // unsupported; do nothing (some Pi builds may not have it)
        console.debug("Wake Lock API not supported");
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.info('Wake Lock released');
        });
        console.info('Wake Lock acquired');
      } catch (err) {
        console.warn('Could not acquire Wake Lock:', err);
      }
    }
    function releaseWakeLock(){
      try {
        if (wakeLock && typeof wakeLock.release === 'function') {
          wakeLock.release();
          wakeLock = null;
        }
      } catch(e){
        console.warn('Error releasing wake lock', e);
      }
    }

    // Auto-reload iframe if it seems to crash/blank (best-effort)
    frame.addEventListener('error', function(){
      console.warn("iframe error detected; reloading in 5s");
      status.textContent = "Frame error; reloading...";
      setTimeout(()=> {
        frame.src = frame.src; // reload
      }, 5000);
    });

    // If iframe's contentWindow is navigated to unexpected origin, wipe it (defense-in-depth)
    window.addEventListener('message', function(ev){
      try {
        const origin = ev.origin || (new URL(ev.data && ev.data.origin || '', window.location.href)).origin;
        if (origin && ALLOWED_ORIGINS.indexOf(origin) === -1) {
          console.warn('Message from disallowed origin', origin);
        }
      } catch (e) {}
    });

    // Initialization
    window.addEventListener('DOMContentLoaded', async function(){
      // bind button
      btn.addEventListener('click', togglePause);
      btn.setAttribute('role','button');
      btn.setAttribute('aria-pressed','false');

      // load external playlist if present (non-blocking)
      await tryLoadExternalPlaylist();

      // try to prevent screen sleep
      requestWakeLock().catch(()=>{});

      // start rotation
      rotatePages();

      // Friendly reminders in the status area
      // If the file is opened via file:// the tokens in URLs are exposed to anyone with the file.
      if (location.protocol === 'file:') {
        status.textContent = "Running from file:// — serve via HTTP for better security";
      }
    }, { once: true });

    // Clean up wake lock on visibility change
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible') {
        // reacquire on visible
        await requestWakeLock();
      } else {
        releaseWakeLock();
      }
    });

    // Expose simple API for debugging in console (disabled in production if you remove this)
    window.mptb = {
      getPlaylist: () => playlist,
      setIndex: i => { currentIndex = ((i|0) + playlist.length) % playlist.length; },
      pause: () => { if(!isPaused) togglePause(); },
      resume: () => { if(isPaused) togglePause(); }
    };

  })();
  </script>

  <!--
    Notes & Raspberry Pi 64-bit tips:

    1) Serve the folder via a simple HTTP server (recommended), e.g.:
       python3 -m http.server 8000
       Then open http://<pi-ip>:8000/ in the Pi's browser.

    2) Recommended Chromium kiosk flags (example command):
       /usr/bin/chromium-browser --kiosk --start-fullscreen --noerrdialogs --disable-infobars --disable-session-crashed-bubble --disable-translate --overscroll-history-navigation=0 http://localhost:8000/

       On Raspberry Pi OS (64-bit) the binary might be /usr/bin/chromium or chromium-browser.

    3) External playlist:
       Create playlist.json in the same directory with a JSON array:
       [
         { "url": "https://app.powerbi.com/view?r=...", "seconds": 60 },
         ...
       ]

    4) Security:
       - Tokens in the Power BI "r=" query are effectively public if someone gets the file; rotate/revoke embed codes periodically.
       - Prefer serving via HTTPS and setting server-side CSP headers for production.
       - If the kiosk is physically accessible, lock down OS, disable devtools, and run in kiosk/account with limited permissions.

    5) If running into Wake Lock limitations, Pi builds sometimes lack it — using the --disable-power-saver or playing a tiny muted looped video in the background is an alternate workaround.

  -->
</body>
</html>
