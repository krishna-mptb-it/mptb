<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <!-- MODIFICATION 1: Added 'self' to frame-src to allow local repo HTML files -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   frame-src 'self' https://app.powerbi.com;
                   base-uri 'none';
                   form-action 'none';">
    <title>MPTB Dashboard with Manual Pause</title>
    <style>
        body, html, iframe {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: none;
            background-color: #000;
            transition: opacity 1s ease-in-out;
        }

        #controlBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s ease;
        }

        #controlBtn.paused {
            background-color: #34c759;
        }
    </style>
</head>
<body>
    <button id="controlBtn">⏸ PAUSE LOOP</button>

    <iframe
        id="tv_frame"
        src=""
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        referrerpolicy="no-referrer"
        title="Rotating dashboard report">
    </iframe>

    <script>
    (function () {
        "use strict";

        var ALLOWED_ORIGINS = ["https://app.powerbi.com"];

        // MODIFICATION 2: Added local mptb-qr-code.html into playlist array
        var playlist = Object.freeze([
            { url: "./mptb-qr-code.html", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMjhkNDIwYmUtZjQ4NS00NzlkLTkyNjAtN2NlNTc5MGIyNWI1IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=89f4222f499db8b7151e", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiODg4ZGU0MmEtOGQxYS00ZWUwLTg2YzAtMjIwYzFlMzNlMGY2IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiZTRkMzY4OWItODkxOC00Y2RmLTgzNjUtOWYxNmNjYjRjMzZhIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=96f23636355369177a32", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMWNlYjU1MWUtYWE2Yi00MGVlLWI5ZjktNWFiNjBmYjlhYTIwIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=8fdd5fa7970fdfe09973", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiYTE1N2IwM2MtOGZkNC00NmMwLTg4MmYtNzFiMjZjOGYwMWVmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=f3fc2c2f149db14e5fb9", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiYzFiYzNjMjMtMmY1Zi00NDhmLTg3MzItNzEzZjcxMzBlOTE5IiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9&pageName=e951a6008d400334c680", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiNzc1NTAzNjEtMDRkNC00NDQwLTg3NTgtMjdkNDVkMDRlZTllIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiMWM5ODE2ZmEtZjRmMC00YWVjLWJmMzUtMDhhZGYwMmY1OWNmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 5 },
            { url: "https://app.powerbi.com/view?r=eyJrIjoiNWFlNzg4OWItZTc3NS00ZTY3LWFmNmUtNzM2NWMwMjMyOWFmIiwidCI6IjkyZjYwN2VmLWFmNjQtNGZmMC04Y2UzLTM3YWFlNGQ2Y2Y5OSJ9", seconds: 5 }
        ]);

        let currentIndex = 0;
        let rotationTimeout = null;
        let isPaused = false;

        // MODIFICATION 3: Updated URL validation to allow same-origin GitHub Pages files
        function isAllowedUrl(rawUrl) {
            try {
                const parsed = new URL(rawUrl, window.location.href);
                if (parsed.origin === window.location.origin) return true;
                if (parsed.protocol !== "https:") return false;
                return ALLOWED_ORIGINS.indexOf(parsed.origin) !== -1;
            } catch (e) {
                return false;
            }
        }

        function rotatePages() {
            if (isPaused) return;
            if (!Array.isArray(playlist) || playlist.length === 0) {
                console.error("Playlist is empty; nothing to rotate.");
                return;
            }

            const currentItem = playlist[currentIndex];
            if (!currentItem || typeof currentItem.url !== "string") {
                console.error("Invalid playlist item at index", currentIndex);
                currentIndex = (currentIndex + 1) % playlist.length;
                rotationTimeout = setTimeout(rotatePages, 5000);
                return;
            }

            if (isAllowedUrl(currentItem.url)) {
                document.getElementById("tv_frame").src = currentItem.url;
            } else {
                console.error("Blocked disallowed URL:", currentItem.url);
            }

            const waitTime = (Number.isFinite(currentItem.seconds) ? currentItem.seconds : 5) * 1000;
            currentIndex = (currentIndex + 1) % playlist.length;

            clearTimeout(rotationTimeout);
            rotationTimeout = setTimeout(rotatePages, waitTime);
        }

        function togglePause() {
            const btn = document.getElementById("controlBtn");
            isPaused = !isPaused;
            if (isPaused) {
                clearTimeout(rotationTimeout);
                btn.textContent = "▶ RESUME ROTATION";
                btn.classList.add("paused");
                btn.setAttribute("aria-pressed", "true");
            } else {
                btn.textContent = "⏸ PAUSE LOOP";
                btn.classList.remove("paused");
                btn.setAttribute("aria-pressed", "false");
                rotatePages();
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById("controlBtn");
            btn.addEventListener("click", togglePause);
            btn.setAttribute("role", "button");
            btn.setAttribute("aria-pressed", "false");
            rotatePages();
        }, { once: true });

    })();
    </script>
</body>
</html>
